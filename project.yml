name: ZenFlipClock
options:
  bundleIdPrefix: com.mad
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_ENTITLEMENTS: ""
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: "App/Resources/Info.plist"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
targets:
  App:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.mad.FlipClock"
        PRODUCT_NAME: "Zen Flip Clock"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "*.md"
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
