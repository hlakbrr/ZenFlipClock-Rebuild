name: Build unsigned ipa

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 固定 Xcode 15.4；若镜像已移除则回退默认版本
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            echo "Pinned Xcode 15.4 missing, falling back to default:"
            xcode-select -p
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project ZenFlipClock.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40

      - name: Package ipa
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -type d -name "*.app" | head -1)
          echo "App at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA="ZenFlipClock-$(echo "${GITHUB_REF_NAME}" | tr '/' '-').ipa"
          zip -qry "$IPA" Payload
          ls -lh "$IPA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFlipClock-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
