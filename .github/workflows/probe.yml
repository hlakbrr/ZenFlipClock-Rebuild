name: Probe CI

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  probe-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping
        run: echo "ubuntu runner alive" && uname -a && date -u

  probe-mac:
    runs-on: macos-15
    steps:
      - name: Ping
        run: echo "macos runner alive" && uname -a && date -u
